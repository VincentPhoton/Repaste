<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="452" viewBox="0 0 1200 452"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Repaste · 刘海剪贴板</title>
  <desc id="hero-desc">Repaste 是一款 macOS 剪贴板管理器：鼠标滑到刘海 0.1 秒呼出历史面板，每条内容显示来源 App，链接可一键跳转，常用内容可沉淀为模板组。</desc>

  <defs>
    <!-- App 图标同款对角渐变（方案10 精修版） -->
    <linearGradient id="logoGrad" x1="0" y1="0" x2="0.82" y2="1">
      <stop offset="0" stop-color="#b39cff"/>
      <stop offset="0.52" stop-color="#8a63f0"/>
      <stop offset="1" stop-color="#5f37c4"/>
    </linearGradient>
    <!-- 图片缩略图示意 -->
    <linearGradient id="thumbGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b6bff"/>
      <stop offset="1" stop-color="#f0a3c0"/>
    </linearGradient>
    <!-- 面板投影：仅用于分离重叠层 -->
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <!-- 屏幕裁切容器圆角 -->
    <clipPath id="screenClip">
      <rect x="636" y="56" width="520" height="244" rx="18"/>
    </clipPath>
  </defs>

  <!-- 背景：哑光纯黑（与 App 面板同色 #0A0A0A） -->
  <rect width="1200" height="452" rx="26" fill="#0A0A0A"/>

  <!-- ======================== 左：标题区 ======================== -->

  <!-- Logo：层叠卡片 + 刘海（App 图标母题缩影） -->
  <g id="logo">
    <rect x="56" y="68" width="56" height="56" rx="15" fill="url(#logoGrad)"/>
    <!-- 白卡 + 文本行 -->
    <rect x="68" y="96" width="32" height="22" rx="5" fill="#ffffff" opacity="0.96"/>
    <rect x="74" y="102" width="19" height="3.5" rx="1.75" fill="#8a63f0"/>
    <rect x="74" y="108.5" width="12" height="3.5" rx="1.75" fill="#8a63f0" opacity="0.55"/>
    <!-- 刘海 + 摄像头 -->
    <path d="M74 68 h20 v6.5 a5 5 0 0 1 -5 5 h-10 a5 5 0 0 1 -5 -5 z" fill="#0a0a0a"/>
    <circle cx="84" cy="73.5" r="1.8" fill="#46d17e"/>
    <!-- 眉题 -->
    <text x="128" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
          font-size="18" letter-spacing="2" fill="#9AA3B8">macOS 原生 · 零权限 · 开源</text>
  </g>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="56" y="208" font-size="66" font-weight="700" letter-spacing="1" fill="#EEF3FF">Repaste</text>
    <text x="57" y="250" font-size="29" font-weight="600" letter-spacing="8" fill="#A38BFF">刘海剪贴板</text>
    <text x="56" y="296" font-size="23" fill="#D6E4FB">鼠标滑到刘海，0.1 秒呼出剪贴板历史。</text>
    <text x="56" y="330" font-size="20" fill="#9AA3B8">每条内容来自哪个 App、是什么类型，一眼可见。</text>
  </g>

  <!-- 特性胶囊 -->
  <g id="feature-chips" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
     font-size="18" fill="#D6E4FB">
    <rect x="56" y="362" width="152" height="32" rx="16" fill="none" stroke="rgba(255,255,255,0.14)"/>
    <text x="132" y="383" text-anchor="middle">来源 App 识别</text>
    <rect x="220" y="362" width="148" height="32" rx="16" fill="none" stroke="rgba(255,255,255,0.14)"/>
    <text x="294" y="383" text-anchor="middle">自定义模板组</text>
    <rect x="380" y="362" width="148" height="32" rx="16" fill="none" stroke="rgba(255,255,255,0.14)"/>
    <text x="454" y="383" text-anchor="middle">链接一键直开</text>
  </g>

  <!-- ======================== 右：刘海面板证明 ======================== -->

  <!-- 屏幕顶部裁切（菜单栏 + 桌面） -->
  <g id="screen-crop">
    <rect x="636" y="56" width="520" height="244" rx="18" fill="#0C0C10" stroke="rgba(255,255,255,0.10)"/>
    <!-- 菜单栏 -->
    <rect x="636" y="56" width="520" height="30" fill="#17171D" clip-path="url(#screenClip)"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
       font-size="16" fill="#9AA3B8">
      <text x="658" y="76">Finder</text>
      <text x="718" y="76">文件</text>
      <text x="762" y="76">编辑</text>
      <text x="1092" y="76" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">21:14</text>
    </g>
    <!-- 电池 -->
    <g stroke="#9AA3B8" fill="none">
      <rect x="1100" y="69" width="21" height="10" rx="3" stroke-width="1.5"/>
      <rect x="1122.5" y="72" width="2.5" height="4" rx="1" fill="#9AA3B8" stroke="none"/>
      <rect x="1102" y="71" width="13" height="6" rx="2" fill="#9AA3B8" stroke="none"/>
    </g>
    <!-- 刘海 + 摄像头 -->
    <path d="M846 56 h100 v10 a10 10 0 0 1 -10 10 h-80 a10 10 0 0 1 -10 -10 z" fill="#050507"/>
    <circle cx="896" cy="63.5" r="3" fill="#46D17E" opacity="0.95"/>
  </g>

  <!-- 下拉面板 -->
  <g id="panel">
    <rect x="676" y="90" width="440" height="294" rx="16" fill="#0F0F14"
          stroke="rgba(255,255,255,0.12)" filter="url(#panelShadow)"/>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
      <!-- 搜索行 -->
      <rect x="700" y="104" width="210" height="30" rx="10" fill="rgba(255,255,255,0.04)"
            stroke="rgba(255,255,255,0.10)"/>
      <circle cx="715" cy="118" r="5.5" fill="none" stroke="#8D95AB" stroke-width="2"/>
      <line x1="719" y1="122" x2="723.5" y2="126.5" stroke="#8D95AB" stroke-width="2" stroke-linecap="round"/>
      <text x="732" y="125" font-size="18" fill="#8D95AB">搜索……</text>
      <!-- 设置齿轮 -->
      <g stroke="#9AA3B8" stroke-width="2" stroke-linecap="round" fill="none">
        <circle cx="1050" cy="119" r="7.5"/>
        <line x1="1050" y1="107.5" x2="1050" y2="111"/>
        <line x1="1050" y1="127" x2="1050" y2="130.5"/>
        <line x1="1038.5" y1="119" x2="1042" y2="119"/>
        <line x1="1058" y1="119" x2="1061.5" y2="119"/>
      </g>
      <!-- 电源 -->
      <g stroke="#9AA3B8" stroke-width="2" stroke-linecap="round" fill="none">
        <path d="M1080 110 v7"/>
        <path d="M1073.5 114.5 A 8.5 8.5 0 1 0 1086.5 114.5"/>
      </g>

      <!-- 标签页行：选中「全部」白底胶囊 + 模板组标签「常用信息」+ ＋ -->
      <rect x="700" y="148" width="64" height="30" rx="15" fill="#EEF3FF"/>
      <text x="732" y="168" font-size="18" font-weight="700" text-anchor="middle" fill="#0A0A0A">全部</text>
      <text x="790" y="168" font-size="18" fill="#9AA3B8">文本</text>
      <text x="846" y="168" font-size="18" fill="#9AA3B8">图片</text>
      <text x="902" y="168" font-size="18" fill="#9AA3B8">链接</text>
      <text x="958" y="168" font-size="18" fill="#9AA3B8">常用信息</text>
      <text x="1048" y="169" font-size="18" font-weight="700" fill="#A38BFF">＋</text>

      <!-- 来源条 -->
      <text x="700" y="204" font-size="18"><tspan fill="#D6E4FB">全部来源</tspan><tspan fill="#8D95AB"> · Safari · 终端 · Notion</tspan></text>

      <line x1="700" y1="216" x2="1092" y2="216" stroke="rgba(255,255,255,0.08)"/>

      <!-- 卡片 1 · 链接（域名加粗 + 外置跳转按钮） -->
      <circle cx="708" cy="246" r="5" fill="#4FD47F"/>
      <text x="724" y="253" font-size="21" font-weight="700" fill="#EEF3FF">maccy.app</text>
      <rect x="946" y="230" width="78" height="30" rx="15" fill="#7450EA"/>
      <text x="985" y="251" font-size="18" font-weight="700" text-anchor="middle" fill="#FFFFFF">跳转 ↗</text>
      <g fill="#9AA3B8">
        <circle cx="1078" cy="238.5" r="2.3"/>
        <circle cx="1078" cy="246" r="2.3"/>
        <circle cx="1078" cy="253.5" r="2.3"/>
      </g>
      <text x="724" y="277" font-size="18" fill="#8D95AB">Safari · 2 分钟前</text>

      <line x1="700" y1="290" x2="1092" y2="290" stroke="rgba(255,255,255,0.08)"/>

      <!-- 卡片 2 · 文本（等宽命令 + 来源 App） -->
      <circle cx="708" cy="320" r="5" fill="#8FD0F4"/>
      <text x="724" y="327" font-size="19" fill="#D6E4FB"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace">npm run dev --host 0.0.0.0</text>
      <g fill="#9AA3B8">
        <circle cx="1078" cy="312.5" r="2.3"/>
        <circle cx="1078" cy="320" r="2.3"/>
        <circle cx="1078" cy="327.5" r="2.3"/>
      </g>
      <text x="724" y="351" font-size="18" fill="#8D95AB">终端 · 8 分钟前 · 1,204 字</text>
    </g>
  </g>
</svg>
