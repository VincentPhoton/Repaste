.body{ min-width:0; flex:1; }
.t1{ font-size:13.5px; line-height:1.5; color:var(--fg-strong);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden; word-break:break-word; }
.t1.mono{ font-family:var(--mono); font-size:12.5px; letter-spacing:.1px; }
.t1 .dom{ font-weight:700; color:var(--fg-strong); }
.t1 .path{ color:var(--muted); font-weight:400; word-break:break-all; }

.t2{ font-size:11.5px; color:var(--muted); margin-top:4px;
  display:flex; gap:7px; align-items:center; flex-wrap:wrap; }
.t2 .dot{ width:3px; height:3px; border-radius:50%; background:var(--muted3); }
.src{ display:inline-flex; align-items:center; gap:5px; cursor:pointer;
  border-bottom:1px dotted rgba(255,255,255,.22); }
.src:hover{ color:var(--fg); border-bottom-color:var(--fg); }
.src .unknown{ color:var(--t-unknown); }
.pintag{ color:var(--warn); font-size:11px; }

.tk{ display:inline-flex; align-items:center; gap:5px; font-size:11px; }
.tk i{ width:6px; height:6px; border-radius:50%; display:inline-block; }
.tk.text{ color:var(--t-text); }  .tk.text i{ background:var(--t-text); }
.tk.image{ color:var(--t-image); } .tk.image i{ background:var(--t-image); }
.tk.link{ color:var(--t-link); }  .tk.link i{ background:var(--t-link); }
.tk.file{ color:var(--t-file); }  .tk.file i{ background:var(--t-file); }
.tk.unknown{ color:var(--t-unknown); } .tk.unknown i{ background:var(--t-unknown); }

.rowact{ display:flex; gap:8px; align-items:center; flex:0 0 auto; padding-top:2px; }

.more{
  width:32px; height:32px; flex:0 0 auto; border-radius:8px; border:1px solid transparent;
  background:transparent; color:var(--muted); cursor:pointer; font-size:17px; line-height:1;
  font-family:var(--font); letter-spacing:.5px; display:grid; place-items:center; padding-bottom:3px;
}
.more:hover{ background:rgba(255,255,255,.15); color:var(--fg); }

.btn{
  font-size:12px; padding:5px 12px; border-radius:8px; cursor:pointer; font-family:var(--font);
  background:#2a2a2a; border:1px solid transparent; color:var(--fg);
  display:inline-flex; align-items:center; gap:5px;
}
.btn:hover{ background:rgba(255,255,255,.17); }
.btn.primary{ background:var(--accent-btn); border-color:transparent; color:#fff; font-weight:600; }
.btn.primary:hover{ background:var(--accent-btn); box-shadow:0 0 0 3px rgba(116,80,234,.28); }
.btn.ghost{ background:transparent; color:var(--muted); border-color:transparent; }
.btn.ghost:hover{ color:var(--fg); background:rgba(255,255,255,.09); }
.btn.danger{ background:var(--danger-soft); border-color:rgba(255,107,98,.45); color:#ff9089; }
.btn.danger:hover{ background:rgba(255,107,98,.26); color:#ffb3ae; }
.btn.small{ padding:3px 9px; font-size:11px; border-radius:7px; }
.openlink{ display:inline-flex; align-items:center; gap:4px; background:none; border:none; padding:0;
  font-family:var(--font); font-size:inherit; font-weight:600; color:var(--accent); cursor:pointer; }
.openlink:hover{ color:var(--accent-bright); }
.openlink .ic{ width:10px; height:10px; }

.rec{ display:inline-flex; align-items:center; gap:6px; color:var(--muted); }
.rec i{ width:7px; height:7px; border-radius:50%; background:var(--ok); display:inline-block; box-shadow:0 0 6px rgba(79,212,127,.7); }
.rec.off i{ background:var(--danger); box-shadow:0 0 6px rgba(255,107,98,.6); }

/* 空态 */
.empty{ padding:36px 12px; text-align:center; color:var(--muted2); font-size:12.5px; line-height:1.8; }

/* ---------- 模板组条目 ---------- */
.tpl-foot{ display:flex; align-items:center; gap:8px; padding:8px 12px 4px; }
.tpl-foot .cnt{ margin-left:auto; font-weight:400; font-size:11px; color:var(--muted2); font-family:var(--mono); }
.tpl-foot .tpl.add{ display:inline-flex; flex:0 0 auto; }
.tpl{
  display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:9px;
  cursor:pointer; font-size:12.5px; color:var(--fg); border:1px solid transparent;
}
.tpl:hover,.tpl.sel{ background:rgba(255,255,255,.08); border-color:var(--stroke); }
.tpl .nm{ font-weight:600; flex:1 1 auto; min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.tpl .pv{ color:var(--muted); font-size:11.5px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-family:var(--mono); }
.tpl .emo{ font-size:15px; flex:0 0 auto; }
.tpl.add{ color:var(--accent); font-weight:600; }
.tpl.add:hover{ background:rgba(139,107,255,.12); }

/* ---------- 弹窗 ---------- */
.modal{
  position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
  background:rgba(0,0,0,.55);
}
.mbox{
  width:430px; background:#1e1e1e;
  border:none; border-radius:20px; padding:20px 22px 18px; color:var(--fg);
  box-shadow:0 40px 110px rgba(0,0,0,.6);
}
.mbox.wide{ width:560px; }
.mbox h4{ font-size:15px; font-weight:700; color:var(--fg-strong); margin-bottom:2px; }
.mbox .msub{ font-size:11.5px; color:var(--muted); margin-bottom:14px; }
.field{ margin:12px 0 0; }
.field label{ display:block; font-size:11.5px; color:var(--muted); margin-bottom:6px; }
.field input,.field textarea,.field select{
  width:100%; background:transparent; border:1px solid rgba(255,255,255,.12);
  border-radius:12px; color:var(--fg); font-size:13px; font-family:var(--font);
  padding:9px 11px; outline:none;
}
.field input:focus,.field textarea:focus,.field select:focus{
  border-color:var(--accent-line); box-shadow:0 0 0 3px rgba(139,107,255,.14);
}
.field input::placeholder,.field textarea::placeholder{ color:var(--muted2); }
.field textarea{ resize:none; line-height:1.6; }
.acts{ display:flex; justify-content:flex-end; gap:9px; margin-top:18px; }
.dangerbox h4{ color:#ff9089; }
.dangerbox > .ic{ width:44px; height:44px; border-radius:12px; display:grid; place-items:center;
  background:var(--danger-soft); color:var(--danger); font-size:20px; margin-bottom:14px; }

/* ---------- 设置弹框 ---------- */
.settingsbox{ width:576px; display:flex; padding:0; overflow:hidden; position:relative; }
.swin-btns{ position:absolute; top:17px; left:20px; display:flex; gap:8px; z-index:5; }
.winbtn{ width:12px; height:12px; border-radius:50%; border:1px solid; padding:0; cursor:pointer; position:relative; }
.winbtn.close{ background:#ff5f57; border-color:#e0443e; }
.winbtn.min{ background:#febc2e; border-color:#d89e24; }
.winbtn i{ position:absolute; inset:0; display:grid; place-items:center; font-style:normal;
  font-size:9px; font-weight:700; line-height:1; color:rgba(0,0,0,.55); opacity:0; }
.winbtn:hover i{ opacity:1; }
.sside{ width:148px; flex:0 0 auto; padding:46px 10px 16px;
  border-right:1px solid rgba(255,255,255,.07); background:transparent; }
.snav{ display:flex; align-items:center; gap:9px; padding:8px 11px; border-radius:8px;
  font-size:12.5px; color:var(--fg-dim); cursor:pointer; margin-bottom:2px; }
.snav:hover{ background:rgba(255,255,255,.06); color:var(--fg); }
.snav.active{ background:#fff; color:#0a0a0a; font-weight:600; }
.snav .sico{ font-size:14px; }
.smain{ flex:1; min-width:0; padding:18px 20px; }
.smain h3{ font-size:16px; font-weight:700; color:var(--fg-strong); }
.smain .desc{ font-size:11.5px; color:var(--muted); margin:3px 0 14px; }
.card2{ border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:4px 15px 10px; margin-bottom:12px;
  background:transparent; }
.card2 h5{ font-size:12px; font-weight:700; color:var(--fg-strong); padding-top:11px; }
.card2 .cdesc{ font-size:10.5px; color:var(--muted); margin:2px 0 8px; }
.srow{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:9px 0;
  border-top:1px solid rgba(255,255,255,.055); font-size:12.5px; }
.srow .sub{ font-size:10.5px; color:var(--muted2); margin-top:1px; }
.sw{ width:36px; height:20px; border-radius:11px; background:rgba(255,255,255,.12); position:relative;
  flex:0 0 auto; cursor:pointer; transition:background .15s ease; }
.sw i{ position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%;
  background:#8a93a8; transition:left .16s ease, background .15s ease; }
.sw.on{ background:var(--accent); }
.sw.on i{ left:18px; background:#fff; }
.sw.locked{ opacity:.45; cursor:default; }
.radio-row{ display:flex; gap:11px; align-items:flex-start; padding:10px 0; cursor:pointer;
  border-top:1px solid rgba(255,255,255,.055); }
.radio-row .radio{ width:18px; height:18px; border-radius:50%; border:2px solid var(--muted2);
  flex:0 0 auto; margin-top:1px; position:relative; }
.radio-row .radio.on{ border-color:var(--accent); }
.radio-row .radio.on::after{ content:""; position:absolute; inset:3px; border-radius:50%; background:var(--accent); }
.radio-row .rt{ font-size:12.5px; color:var(--fg); }
.radio-row .rd{ font-size:11px; color:var(--muted); margin-top:2px; line-height:1.55; }
.pill{
  font-size:12px; color:var(--fg-dim); background:rgba(255,255,255,.09);
  border:none; border-radius:7px; padding:3px 9px;
  font-family:var(--mono); letter-spacing:.2px;
}
select.pillselect{ border-radius:7px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12);
  color:var(--fg); font-size:12px; font-family:var(--font); padding:4px 8px; outline:none; }

/* ---------- 更多菜单 ---------- */
.mmenu{
  position:absolute; z-index:110; width:218px; padding:6px; border-radius:14px;
  background:#232323;
  box-shadow:0 22px 60px rgba(0,0,0,.55);
}
.mmenu .mi{ display:flex; align-items:center; gap:10px; padding:8px 11px; border-radius:8px;
  font-size:12.5px; color:var(--fg); cursor:pointer; }
.mmenu .mi:hover{ background:rgba(255,255,255,.09); }
.mmenu .mi .mico{ width:16px; text-align:center; color:var(--muted); font-size:13px; flex:0 0 auto; }
.mmenu .mi.hotkey{ justify-content:space-between; }
.mmenu .mi .hk{ font-size:10px; color:var(--muted2); font-family:var(--mono); }
.mmenu .mi.danger{ color:#ff9089; }
.mmenu .mi.danger .mico{ color:#ff9089; }
.mmenu .mi.danger:hover{ background:var(--danger-soft); }
.mmenu .msep{ height:1px; margin:5px 8px; background:rgba(255,255,255,.08); }
.mmenu .mtitle{ padding:7px 11px 5px; font-size:10.5px; color:var(--muted2); letter-spacing:.4px; }

/* ---------- 图片放大 ---------- */
.lb-img{ border-radius:12px; overflow:hidden; border:none;
  background:#0d0d14; position:relative; }
.lb-img img{ width:100%; display:block; }
.lb-meta{ display:flex; gap:12px; align-items:center; font-size:11.5px; color:var(--muted); margin-top:10px; flex-wrap:wrap; }
.lb-degrade{ margin-top:8px; padding:7px 10px; border-radius:8px; font-size:11.5px;
  background:rgba(255,180,84,.14); border:none; color:#ffd9a0;
  display:flex; align-items:center; gap:8px; }

/* ---------- 首次引导 ---------- */
.onb-card{
  width:820px; background:#1e1e1e;
  border:none; border-radius:24px; overflow:hidden;
  box-shadow:0 48px 130px rgba(0,0,0,.6);
  display:flex; z-index:120;
}
.onb-side{ width:200px; flex:0 0 auto; padding:26px 16px; border-right:1px solid rgba(255,255,255,.07);
  background:transparent; }
.onb-step{ display:flex; gap:12px; align-items:center; padding:12px 12px; border-radius:11px; cursor:pointer; }
.onb-step .num{ width:26px; height:26px; border-radius:50%; flex:0 0 auto; display:grid; place-items:center;
  font-size:12px; font-weight:700; color:var(--muted); background:rgba(255,255,255,.10); border:none; }
.onb-step.active .num{ background:var(--accent); color:#fff; border-color:transparent; box-shadow:0 0 0 4px rgba(139,107,255,.18); }
.onb-step .tt{ font-size:12.5px; color:var(--fg); font-weight:600; }
.onb-step.active .tt{ color:#fff; }
.onb-step .sub{ font-size:10.5px; color:var(--muted2); margin-top:1px; }
.onb-main{ flex:1; min-width:0; padding:28px 30px; }
.onb-main h3{ font-size:19px; font-weight:700; color:var(--fg-strong); }
.onb-main .desc{ font-size:12.5px; color:var(--muted); margin:8px 0 18px; line-height:1.7; }
.onb-foot{ display:flex; align-items:center; justify-content:space-between; margin-top:20px; }
.dots{ display:flex; gap:6px; }
.dots span{ width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.15); }
.dots span.active{ background:var(--accent); }

/* 隐私特性卡 */
.feature{ display:flex; gap:14px; align-items:flex-start; padding:12px 14px; border-radius:12px;
  border:none; background:rgba(255,255,255,.05); margin-bottom:10px; }
.feature .fic{ width:34px; height:34px; border-radius:10px; flex:0 0 auto; display:grid; place-items:center;
  font-size:16px; background:rgba(139,107,255,.16); color:var(--accent-bright); border:none; }
.feature .ft{ font-size:13px; font-weight:600; color:var(--fg); }
.feature .fd{ font-size:11.5px; color:var(--muted); margin-top:2px; line-height:1.6; }

/* 默认 Tab 选择 */
.tabpicker{ display:flex; gap:6px; }
.tabpicker .tp{ font-size:12px; padding:6px 14px; border-radius:8px; cursor:pointer;
  color:var(--fg-dim); background:rgba(255,255,255,.08); border:none; }
.tabpicker .tp.active{ color:#fff; background:var(--accent-soft); border-color:var(--accent-line); font-weight:600; }

/* 刘海试用（脉冲） */
.tryzone{ display:flex; flex-direction:column; align-items:center; padding:6px 0 2px; }
.try-notch{ position:relative; width:190px; height:28px; background:#000; border-radius:0 0 12px 12px;
  margin-bottom:10px; }
.try-notch .tcam{ position:absolute; top:10px; left:50%; transform:translateX(-50%);
  width:6px; height:6px; border-radius:50%; background:#1a1a22; }
@keyframes pulse{
  0%{ transform:translate(-50%,0); opacity:0; }
  30%{ opacity:.9; }
  100%{ transform:translate(-50%,-14px); opacity:0; }
}
.try-beam{ position:absolute; left:50%; bottom:-3px; width:110px; height:5px; border-radius:4px;
  background:var(--accent-bright); box-shadow:0 0 12px rgba(139,107,255,.9);
  animation:pulse 1.5s ease-out infinite; }
.try-state{ font-size:12px; color:var(--muted); font-family:var(--mono); }

/* ---------- 标注（效果图用，评审可读性） ---------- */
.tag{
  position:absolute; z-index:200; display:inline-flex; align-items:center; gap:7px;
  font-size:11px; color:var(--muted); background:#1c1c1c;
  border:none; border-radius:99px; padding:4px 12px;
  letter-spacing:.2px;
}
.tag b{ color:var(--fg); font-weight:600; }
.tag .tk i{ width:6px; height:6px; }
.fskey{ position:absolute; z-index:200; font-size:10.5px; color:var(--muted2);
  font-family:var(--mono); letter-spacing:.2px; background:rgba(10,9,16,.6);
  border:1px dashed rgba(255,255,255,.14); border-radius:8px; padding:5px 9px; }

/* ---------- App 图标（首字母色块） ---------- */
.ai{ width:17px; height:17px; border-radius:4.5px; display:inline-flex; align-items:center;
  justify-content:center; font-size:9.5px; font-weight:800; color:#fff; flex:0 0 auto;
  font-family:var(--font); letter-spacing:.2px; text-shadow:0 1px 1px rgba(0,0,0,.35); }
.ai.s { font-size:10px; }
.ai.safari{ background:linear-gradient(160deg,#4aa3ff,#1664c9); }
.ai.terminal{ background:linear-gradient(160deg,#3a3a46,#17171d); }
.ai.terminal::before{ content:""; width:7px; height:7px; margin-top:3px; border-left:2px solid #9be28b;
  border-bottom:2px solid #9be28b; transform:rotate(45deg); background:none; text-shadow:none; }
.ai.sshot{ background:linear-gradient(160deg,#c9cede,#8a93a8); color:#1c1f2b; text-shadow:none; }
.ai.notion{ background:linear-gradient(160deg,#2e2e37,#101014); }
.ai.chrome{ background:linear-gradient(160deg,#ff6d5a,#d8401f); }
.ai.wechat{ background:linear-gradient(160deg,#2fb55c,#1d8a42); }
.ai.finder{ background:linear-gradient(160deg,#3aa3ff,#1f74d8); }
.ai.feishu{ background:linear-gradient(160deg,#2f7bff,#1e59d0); }
.ai.unknown{ background:linear-gradient(160deg,#555560,#34343f); }

/* ---------- 桌面图标（点缀用） ---------- */
.dicons{ position:absolute; z-index:10; display:flex; flex-direction:column; gap:22px; }
.dicon{ display:flex; flex-direction:column; align-items:center; gap:6px; width:86px; }
.dicon .itile{ width:58px; height:58px; border-radius:14px; display:grid; place-items:center;
  font-size:26px; color:#fff; box-shadow:0 8px 22px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.08); }
.dicon .cap{ font-size:11px; color:#e6ebf7; text-shadow:0 1px 3px rgba(0,0,0,.8);
  background:rgba(0,0,0,.32); padding:2px 8px; border-radius:6px; }

/* ---------- 菜单栏 App 图标 + 下拉 ---------- */
.mb-app{ width:15px; height:15px; border-radius:4px; flex:0 0 auto;
  background:linear-gradient(160deg,#9d86ff,#5f43c8); display:inline-flex; align-items:center;
  justify-content:center; font-size:8px; font-weight:800; color:#fff; box-shadow:inset 0 0 0 1px rgba(255,255,255,.2); }
.mbpop{
  position:absolute; top:32px; right:10px; z-index:70; width:200px; padding:6px; border-radius:14px;
  background:#232323;
  box-shadow:0 22px 60px rgba(0,0,0,.55); font-size:12.5px;
}
.mbpop .mi{ display:flex; align-items:center; gap:9px; padding:7px 10px; border-radius:8px; color:var(--fg); cursor:pointer; }
.mbpop .mi:hover{ background:rgba(255,255,255,.09); }
.mbpop .mi .on{ color:var(--ok); font-size:10px; }
.mbpop .mi.danger{ color:#ff9089; }
.mbpop .msep{ height:1px; margin:5px 7px; background:rgba(255,255,255,.08); }

/* ---------- 引导（slim 三联版） ---------- */
.onb-slim{ width:396px; padding:24px 26px 22px; }
.onb-slim .head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.onb-slim .head .stp{ font-size:11px; font-family:var(--mono); color:var(--accent-bright); font-weight:700; }
.onb-slim h3{ font-size:18px; font-weight:700; color:var(--fg-strong); }
.onb-slim .desc{ font-size:12.5px; color:var(--muted); line-height:1.7; margin:8px 0 16px; }

/* ---------- 卡片对比（scr-06） ---------- */
.cmp-head{ position:absolute; top:56px; left:50%; transform:translateX(-50%); z-index:40; text-align:center; }
.cmp-head h2{ font-size:22px; font-weight:800; color:var(--fg-strong); letter-spacing:.5px; }
.cmp-head p{ font-size:12px; color:var(--muted); margin-top:5px; font-family:var(--mono); }
.cmp-col{ position:absolute; top:150px; width:423px; z-index:40; }
.cmp-col .clabel{ display:flex; align-items:center; gap:8px; margin-bottom:12px; font-size:13px; font-weight:700; color:var(--fg); }
.cmp-col .clabel .cnum{ width:24px; height:24px; border-radius:8px; display:grid; place-items:center;
  font-size:12px; background:var(--accent); color:#fff; }
.cmp-col .clabel .csub{ font-size:10.5px; color:var(--muted2); font-weight:400; font-family:var(--mono); }
.cmp-card{ background:#0a0a0a; border:none; border-radius:16px;
  padding:16px 18px; }
.cmp-note{ position:absolute; top:150px; left:50%; width:150px; z-index:40; font-size:11px; color:var(--muted);
  line-height:1.7; font-family:var(--mono); }
.cmp-note b{ color:var(--fg); }

/* ---------- 截屏缩略图（CSS 绘制的暗色编辑器截图） ---------- */
.shot{ background:#0d1117; border-radius:6px; overflow:hidden; display:flex; flex-direction:column;
  width:100%; height:100%; border:1px solid rgba(255,255,255,.05); }
.shot .sbar{ height:12px; flex:0 0 auto; display:flex; align-items:center; gap:3px; padding:0 5px;
  background:rgba(255,255,255,.05); }
.shot .sbar i{ width:3px; height:3px; border-radius:50%; background:rgba(255,255,255,.28); }
.shot .scode{ padding:5px 6px; font-family:var(--mono); font-size:5.5px; line-height:1.55;
  color:#8fd0f4; word-break:break-all; }
.shot .scode .dim{ color:#5c6476; } .shot .scode .gr{ color:#7ee787; }
.shot .scode .og{ color:#ffa657; } .shot .scode .pk{ color:#ff9bce; }
.shot.lg .sbar{ height:16px; padding:0 7px; } .shot.lg .sbar i{ width:5px; height:5px; }
.shot.lg .scode{ padding:10px 13px; font-size:9.5px; line-height:1.7; }

/* ---------- 标题注脚（效果图页脚） ---------- */
.corner-tag{
  position:absolute; left:18px; bottom:14px; z-index:210; font-size:10.5px; color:var(--muted3);
  font-family:var(--mono); letter-spacing:.4px;
}

      else { n.classList.toggle("on"); post("tap","sw",n.classList.contains("on")?"已开启":"已关闭"); }
      return;
    }
    if((n=t.closest(".tp"))){ solo(n,"active"); post("tap","tp",txt(n)); return; }
    if((n=t.closest(".ip"))){ solo(n,"active"); post("tap","ip",txt(n)); return; }
    if((n=t.closest(".tab"))){ solo(n,"active"); post("tap","tab",txt(n)); return; }
    if((n=t.closest(".srccap"))){ post("tap","btn","打开来源筛选"); return; }
    if((n=t.closest(".sitem"))){ solo(n,"active"); post("tap","chip",txt(n)); return; }
    if((n=t.closest(".chip"))){ solo(n,"active"); post("tap","chip",txt(n)); return; }

  },false);
  document.addEventListener("mouseover",function(e){
    var n=e.target.closest?e.target.closest(".notch,.capsule,.try-notch"):null;

  }
  function setSrcdoc(i){
    var s = SCREENS[i];
    if(!cached[i]) cached[i] = "<!doctype html>" + document.getElementById("tpl-" + s.key).innerHTML + driverCode(i);
    frame.srcdoc = cached[i];
  }
  function render(){
    var s = SCREENS[idx];
    setSrcdoc(idx);
    for(var k=0;k<chips.length;k++) chips[k].classList.toggle("active", k===idx);
    count.textContent = (idx+1) + " / " + SCREENS.length;
    capNm.textContent = s.key + " · " + s.name;
    capDs.textContent = s.desc;
    capFl.textContent = s.file;
    document.title = "刘海剪贴板 · " + s.name;
  }
  function show(n, persist){
    idx = ((n % SCREENS.length) + SCREENS.length) % SCREENS.length;
    var cap = document.querySelector(".caption");
    stage.classList.add("swap");
    if(cap) cap.classList.add("swap");
    clearTimeout(swapTimer);
    swapTimer = setTimeout(function(){
      render();
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          stage.classList.remove("swap");
          if(cap) cap.classList.remove("swap");
        });
      });
    }, SWAP_MS);
    if(persist !== false){ try{ localStorage.setItem(LS_KEY, idx); }catch(e){} }
    var ch = document.getElementById("chips");
    var el = chips[idx];
    if(el) ch.scrollLeft = el.offsetLeft - ch.clientWidth/2 + el.clientWidth/2;
  }
  /* ---------- 视图缩放（整体等比放大，画布内部布局不受影响） ---------- */
  var ZOOM_STEPS = [0, 1, 1.25, 1.5, 1.75, 2];
  var ZOOM_KEY = "od-viewer-zoom";
  var zoom = 1.25;
  try { var zSaved = parseFloat(localStorage.getItem(ZOOM_KEY)); if(!isNaN(zSaved) && ZOOM_STEPS.indexOf(zSaved) >= 0) zoom = zSaved; } catch(e){}
  var zoomVal = document.getElementById("zoomVal");
  var stagewrap = document.querySelector(".stagewrap");
  function renderZoom(){
    zoomVal.textContent = zoom === 0 ? "适应" : Math.round(zoom*100) + "%";
    try{ localStorage.setItem(ZOOM_KEY, String(zoom)); }catch(e){}
  }
  function zoomStep(dir){
    var i = ZOOM_STEPS.indexOf(zoom);
    setZoom(ZOOM_STEPS[Math.min(ZOOM_STEPS.length-1, Math.max(0, i+dir))]);
  }
  function setZoom(z){
    if(ZOOM_STEPS.indexOf(z) < 0) return;
    zoom = z; renderZoom(); fit();
  }
  function fit(){
    var availW = stagewrap.clientWidth - 12;
    var availH = stagewrap.clientHeight - 12;
    var s = (zoom === 0) ? Math.min(availW/1440, availH/1000, 1.25) : zoom;
    stage.style.width = Math.round(1440*s) + "px";
    stage.style.height = Math.round(1000*s) + "px";
    frame.style.transform = "scale(" + s + ")";
    hotlay.style.transform = "scale(" + s + ")";
  }

  /* ---------- 流程体验模式 ---------- */
  var FLOW = [
    {i:15, name:"首次启动引导", act:"完成引导 · 开始使用", hs:{x:720,y:520,r:150}, toast:"引导完成 · 已记录你的偏好", hover:true},
    {i:0,  name:"桌面待机",     act:"鼠标滑到刘海",       hs:{x:720,y:20,r:90},  toast:"悬停中…", hover:true},
    {i:1,  name:"待定 · 提示条", act:"继续停留 → 面板展开", hs:{x:720,y:22,r:90},  toast:"停留超过 100ms · 面板准备展开", hover:true},
    {i:2,  name:"展开 · 主面板", act:"点击历史条目 · 写回剪贴板", hs:{x:720,y:240,r:150}, toast:"已写入剪贴板 · 回备忘录 ⌘V"},
    {i:5,  name:"三类卡片",     act:"点击「打开链接」· 直开浏览器", hs:{x:1200,y:600,r:75}, toast:"已在默认浏览器打开链接"},
    {i:6,  name:"⋮ 更多菜单",   act:"打开更多操作",       hs:{x:865,y:280,r:80}, toast:"菜单已展开 · 固定 / 存组 / 删除"},
    {i:7,  name:"图片放大",     act:"查看原图",           hs:{x:720,y:430,r:150}, toast:"大图预览 · 支持复制图片"},
    {i:11, name:"存入模板组",   act:"存入模板组（等价 ⌘G）", hs:{x:720,y:570,r:160}, toast:"已存入「常用信息」"},
    {i:8,  name:"模板组标签页", act:"切换模板组",         hs:{x:720,y:80,r:130},  toast:"已切换到「Prompt」模板组"},
    {i:9,  name:"新建模板组",   act:"命名 · 创建", hs:{x:720,y:520,r:160}, toast:"已创建新模板组 · 自动切换"},
    {i:10, name:"新建模板",     act:"直接填内容 · 保存", hs:{x:720,y:540,r:160}, toast:"模板已保存到当前组"},
    {i:12, name:"设置 · 常规",  act:"点击设置项调整",      hs:{x:900,y:420,r:170}, toast:"设置改动即时生效"},
    {i:13, name:"设置 · 呼出 & 隐私", act:"调整灵敏度 / 隐私项", hs:{x:1000,y:430,r:170}, toast:"已记住设置"},
    {i:14, name:"退出确认",     act:"确认退出",           hs:{x:720,y:520,r:150}, toast:"已退出 · 历史仍保留在本机"},
    {i:3,  name:"快捷键呼出 · 居中", act:"⌥⇧V 呼出 · 键盘主导", hs:{x:720,y:400,r:160}, toast:"快捷键呼出 · 居中面板"},
    {i:4,  name:"胶囊兜底",     act:"无刘海机型 · 胶囊悬停", hs:{x:720,y:48,r:90},  toast:"流程体验完成 ✓ 可重新开始", hover:true}
  ];
  var flowMode = false;
  var fIdx = 0;
  var fTimer = null;
  var hotlay = document.getElementById("hotlay");
  var ftoast = document.getElementById("ftoast");
  var modeToggle = document.getElementById("modeToggle");
  var fbFill = document.getElementById("fb-fill");
  var fbCount = document.getElementById("fb-count");
  var fbAct = document.getElementById("fb-act");
  var fbStep = document.getElementById("fb-step");
  var fbPrev = document.getElementById("fbPrev");
  var fbNext = document.getElementById("fbNext");

  function toast(msg){
    ftoast.innerHTML = msg;
    ftoast.classList.add("on");
    clearTimeout(fTimer);
    fTimer = setTimeout(function(){ ftoast.classList.remove("on"); }, 1300);
  }
  function renderFlow(){
    var f = FLOW[fIdx];
    fbStep.textContent = f.name;
    fbCount.textContent = (fIdx + 1) + " / " + FLOW.length;
    fbFill.style.width = Math.round((fIdx + 1) / FLOW.length * 100) + "%";
    fbPrev.disabled = (fIdx === 0);
    fbNext.textContent = (fIdx === FLOW.length - 1) ? "重新开始 ↻" : "下一步 ›";
    fbAct.textContent = f.act;
    hotlay.innerHTML = "";
    if(f.hs){
      var h = document.createElement("div");
      h.className = "hs";
      h.style.left = f.hs.x + "px";
      h.style.top = f.hs.y + "px";
      h.title = f.act;
      h.setAttribute("role", "button");
      h.setAttribute("aria-label", f.act);
      h.innerHTML = '<span class="ring"></span><span class="lbl">' + f.act + '</span>';
      h.addEventListener("click", function(ev){
        ev.stopPropagation();
        toast("<b>✓</b> " + f.toast);
        setTimeout(function(){ goFlow(fIdx + 1); }, 520);
      });
      hotlay.appendChild(h);
    }
    hotlay.appendChild(ftoast);
    show(f.i, false);
  }
  function goFlow(n){
    if(n < 0) n = 0;
    if(n >= FLOW.length) n = 0;
    fIdx = n;
    renderFlow();
  }
  function enterFlow(){
    flowMode = true;
    document.body.classList.add("flowmode");
    modeToggle.textContent = "◼ 退出流程";
    modeToggle.setAttribute("aria-pressed", "true");
    fIdx = 0;
    renderFlow();
    fit();
  }
  function exitFlow(){
    flowMode = false;
    document.body.classList.remove("flowmode");
    modeToggle.textContent = "▶ 流程体验";
    modeToggle.setAttribute("aria-pressed", "false");
    clearTimeout(fTimer);
    ftoast.classList.remove("on");
    render();
    fit();
  }
  modeToggle.addEventListener("click", function(){ flowMode ? exitFlow() : enterFlow(); });
  fbPrev.addEventListener("click", function(){ goFlow(fIdx - 1); });
  fbNext.addEventListener("click", function(){ goFlow(fIdx + 1); });

  /* ---------- 真实按钮交互：iframe 内 driver 回报 ---------- */
  var OD_MSG = {
    tab:"已切换筛选", row:"已写入剪贴板", tpl:"模板已选择", tp:"已切换",
    ip:"图标已选择", chip:"已切换来源", radio:"已选择", snav:"已切换设置项",
    sw:"开关已切换", close:"已关闭", more:"菜单已展开", btn:"", icon:"打开"
  };
  window.addEventListener("message", function(ev){
    var m = ev.data;
    if(!m || (m.kind !== "tap" && m.kind !== "hover")) return;
    if(flowMode){
      var f = FLOW[fIdx];
      if(m.src === f.i){
        if(m.kind === "hover" && !f.hover) return;
        toast("<b>✓</b> " + f.toast);
        clearTimeout(fTimer);
        setTimeout(function(){ goFlow(fIdx + 1); }, 460);
      }
      return;
    }
    if(m.action === "icon"){ toast("<b>✓</b> " + (OD_MSG.icon || "打开") + "「" + (m.label || "") + "」"); }
    else if(m.action === "btn"){ toast("<b>✓</b> " + (m.label || "已点击")); }
    else { toast("<b>✓</b> " + (OD_MSG[m.action] || "已点击") + (m.label ? " · " + m.label : "")); }
  }, false);

  for(var c=0;c<chips.length;c++){
    (function(ci){ chips[ci].addEventListener("click", function(){ show(ci); }); })(c);
  }
  document.getElementById("prev").addEventListener("click", function(){ if(!flowMode) show(idx-1); });
  document.getElementById("next").addEventListener("click", function(){ if(!flowMode) show(idx+1); });
  document.getElementById("zoomOut").addEventListener("click", function(){ zoomStep(-1); });
  document.getElementById("zoomIn").addEventListener("click", function(){ zoomStep(1); });
  zoomVal.addEventListener("click", function(){ setZoom(0); });
  document.addEventListener("keydown", function(e){
    if(e.key === "+" || e.key === "="){ zoomStep(1); return; }
    else if(e.key === "-" || e.key === "_"){ zoomStep(-1); return; }
    else if(e.key === "0"){ setZoom(0); return; }
    if(flowMode){
      if(e.key === "ArrowRight"){ goFlow(fIdx + 1); }
      else if(e.key === "ArrowLeft"){ goFlow(fIdx - 1); }
      else if(e.key === "Escape"){ exitFlow(); }
      return;
    }
    if(e.key === "ArrowRight"){ show(idx+1); }
    else if(e.key === "ArrowLeft"){ show(idx-1); }
  });

  window.addEventListener("resize", fit);
  render();
  renderZoom();
  fit();
})();
</script>
